name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # GitHub-hosted runners have no GPU: the CPU paths are tested, the CUDA/Triton tests skip.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install (CPU-only PyTorch instead of the CUDA wheels of uv.lock)
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e . pytest matplotlib pillow
      - name: Tests
        run: uv run --no-sync python -m pytest -q
