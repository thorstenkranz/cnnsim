[project]
name = "cnnsim"
version = "0.3.1"
description = "Chua–Yang cellular neural networks in PyTorch: GPU simulation and training"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "matplotlib>=3.8",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cnnsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than a few seconds"]

# Development environment only: CUDA 13 wheels (RTX 50xx needs CUDA >= 12.8).
# Consumers of the wheel choose their own torch build.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
